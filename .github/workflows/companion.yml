name: Check and render companion

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Install rendering dependencies
        run: Rscript --vanilla -e 'install.packages("rmarkdown")'
      - name: Build and check the package
        run: |
          R CMD build BayesComp
          R CMD check --no-manual BayesComp_*.tar.gz
      - name: Install and render in clean R sessions
        run: |
          R CMD INSTALL BayesComp_*.tar.gz
          Rscript --vanilla BayesComp/tools/render-sections.R
      - uses: actions/upload-artifact@v4
        with:
          name: companion
          path: section-*/
